<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Infinia Labour Tool</title>
<style>
  :root {
    --red: #C0392B; --red-hover: #A5301F; --black: #2E3238; --darkgray: #3E434A;
    --silver: #C7CBD1; --lightgray: #F4F5F7;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--lightgray); margin: 0; color: var(--black); }

  /* ---- Login screen ---- */
  #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #login-box { background: white; border-radius: 12px; padding: 36px 40px; width: 320px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  #login-box h1 { font-size: 18px; margin: 0 0 4px; }
  #login-box p { font-size: 12px; color: #888; margin: 0 0 20px; }
  #login-box input { width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  #login-box button { width: 100%; padding: 10px; background: var(--red); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
  #login-box button:hover { background: var(--red-hover); }
  #login-error { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 14px; }

  /* ---- Main app ---- */
  #app-screen { display: none; }
  .topbar { background: var(--black); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .who { font-size: 12px; color: var(--silver); }
  .topbar button { background: transparent; border: 1px solid var(--silver); color: var(--silver); padding: 5px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; }
  .topbar button:hover { background: var(--darkgray); }

  .toolbar { background: white; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #eee; }
  .toolbar label { font-size: 12px; font-weight: bold; color: #555; }
  .toolbar input[type=date] { padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; }
  .toolbar input[type=text] { padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; width: 220px; }
  #viewing-label { font-size: 13px; font-weight: bold; color: var(--red); margin-left: auto; }

  .bulk-bar { background: white; margin: 14px 24px 0; padding: 14px; border-radius: 8px; border: 1px solid #eee; }
  .bulk-bar .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bulk-bar select, .bulk-bar input[type=text] { padding: 6px 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 12px; }
  .bulk-bar button { padding: 7px 14px; border: none; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-primary { background: var(--red); color: white; }
  .btn-primary:hover { background: var(--red-hover); }
  .btn-dark { background: var(--black); color: white; }
  .btn-dark:hover { background: var(--darkgray); }

  #status-msg { margin: 10px 24px 0; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
  #status-msg.ok { background: #C6EFCE; color: #2E7D32; display: block; }
  #status-msg.err { background: #FFC7CE; color: #C0392B; display: block; white-space: pre-line; }
  #status-msg.warn { background: #FFF3CD; color: #8a6d1a; display: block; white-space: pre-line; }

  .grid-wrap { margin: 14px 24px 24px; background: white; border-radius: 8px; border: 1px solid #eee; overflow: auto; max-height: 60vh; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { background: var(--red); color: white; padding: 9px 8px; text-align: center; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  td { padding: 6px 6px; text-align: center; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #FFF7F5; }
  td input[type=checkbox] { transform: scale(1.1); }
  select, .cell-input { padding: 4px 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; width: 100%; }
  .cell-input.narrow { width: 44px; text-align: center; }
  .cell-input.comments { width: 160px; }
  td.empno { font-weight: bold; }

  #loading { text-align: center; padding: 40px; color: #888; font-size: 13px; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Infinia Labour Tool</h1>
    <p>Sign in to continue</p>
    <input type="text" id="login-username" placeholder="Username" value="admin">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="doLogin()">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <h1>Daily Attendance Entry</h1>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="who-label"></span>
      <button onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="toolbar">
    <label>Date:</label>
    <input type="date" id="date-picker" onchange="onDateChange()">
    <label>Search:</label>
    <input type="text" id="search-box" placeholder="Employee No or Name" oninput="renderRows()">
    <span id="viewing-label"></span>
  </div>

  <div class="bulk-bar">
    <div class="row">
      <strong style="font-size:12px;">Bulk-apply to ticked rows:</strong>
      <select id="bulk-am"><option value="">A.M -</option></select>
      <select id="bulk-pm"><option value="">P.M -</option></select>
      <select id="bulk-site"><option value="">Site -</option></select>
      <select id="bulk-engineer"><option value="">Engineer -</option></select>
      <input type="text" id="bulk-ot" placeholder="OT" style="width:50px;">
      <input type="text" id="bulk-bh" placeholder="BH" style="width:50px;">
      <button class="btn-primary" onclick="applyBulk()">Apply to Ticked</button>
      <button class="btn-dark" onclick="selectAll()">Select All</button>
      <button class="btn-dark" onclick="selectNone()">Select None</button>
    </div>
  </div>

  <div id="status-msg"></div>

  <div class="grid-wrap">
    <div id="loading">Loading...</div>
    <table id="grid-table" style="display:none;">
      <thead>
        <tr>
          <th><input type="checkbox" id="header-check" onclick="toggleAll(this.checked)"></th>
          <th>Emp No</th><th>Name</th><th>A.M</th><th>P.M</th><th>Site</th>
          <th>Engineer</th><th>OT</th><th>BH</th><th>Comments</th>
        </tr>
      </thead>
      <tbody id="grid-body"></tbody>
    </table>
  </div>

  <div style="margin: 0 24px 30px;">
    <button class="btn-primary" style="padding:12px 28px; font-size:14px;" onclick="saveAttendance()">Save Attendance</button>
  </div>
</div>

<script>
const API = "https://infinia-labour-tool-api.onrender.com";
const STATUS_OPTIONS = ["Present", "Absent", "Sick", "Medical", "Friday", "Holiday", "Leave"];
let TOKEN = null;
let employees = [];
let sites = [];
let engineers = [];
let rowData = {};       // emp_no -> {am, pm, site, engineer, ot, bh, comments}
let ticked = new Set();
let currentDate = null;

async function apiCall(path, options = {}) {
  const headers = options.headers || {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const res = await fetch(API + path, { ...options, headers });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw { status: res.status, body };
  }
  return res.json();
}

async function doLogin() {
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  try {
    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
    });
    if (!res.ok) throw new Error("Incorrect username or password.");
    const data = await res.json();
    TOKEN = data.access_token;
    sessionStorage.setItem("infinia_token", TOKEN);
    document.getElementById("who-label").textContent = `${data.full_name} (${data.role})`;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "block";
    await initApp();
  } catch (e) {
    errEl.textContent = e.message || "Login failed.";
  }
}

function doLogout() {
  sessionStorage.removeItem("infinia_token");
  location.reload();
}

async function initApp() {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("date-picker").value = today;

  [employees, sites, engineers] = await Promise.all([
    apiCall("/employees?active_only=true"),
    apiCall("/sites"),
    apiCall("/engineers"),
  ]);
  employees.sort((a, b) => a.emp_no.localeCompare(b.emp_no));

  populateSelect("bulk-am", STATUS_OPTIONS, "A.M");
  populateSelect("bulk-pm", STATUS_OPTIONS, "P.M");
  populateSelect("bulk-site", sites.map(s => s.code), "Site");
  populateSelect("bulk-engineer", engineers.map(e => e.name), "Engineer");

  await loadDate(today);
}

function populateSelect(id, values, label) {
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${label} -</option>` + values.map(v => `<option value="${v}">${v}</option>`).join("");
}

async function onDateChange() {
  const d = document.getElementById("date-picker").value;
  if (d) await loadDate(d);
}

async function loadDate(dateStr, preserveStatus) {
  currentDate = dateStr;
  document.getElementById("loading").style.display = "block";
  document.getElementById("grid-table").style.display = "none";
  if (!preserveStatus) showStatus(null);

  const existing = await apiCall(`/attendance/${dateStr}`);
  const byEmp = {};
  existing.forEach(r => byEmp[r.emp_no] = r);

  rowData = {};
  employees.forEach(emp => {
    const r = byEmp[emp.emp_no];
    rowData[emp.emp_no] = {
      am: r ? (r.am || "") : "", pm: r ? (r.pm || "") : "",
      site: r ? (r.site || "") : "", engineer: r ? (r.engineer || "") : "",
      ot: r && r.ot ? String(r.ot) : "", bh: r && r.bh ? String(r.bh) : "",
      comments: r ? (r.comments || "") : "",
    };
  });
  ticked.clear();

  const dateObj = new Date(dateStr + "T00:00:00");
  document.getElementById("viewing-label").textContent =
    "Viewing: " + dateObj.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });

  document.getElementById("loading").style.display = "none";
  document.getElementById("grid-table").style.display = "table";
  renderRows();
}

function renderRows() {
  const search = document.getElementById("search-box").value.trim().toLowerCase();
  const terms = search.split(",").map(t => t.trim()).filter(Boolean);
  const tbody = document.getElementById("grid-body");
  tbody.innerHTML = "";

  employees.forEach(emp => {
    if (terms.length) {
      const match = terms.some(t => emp.emp_no.toLowerCase().includes(t) || emp.name.toLowerCase().includes(t));
      if (!match) return;
    }
    const d = rowData[emp.emp_no];
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="checkbox" ${ticked.has(emp.emp_no) ? "checked" : ""} onchange="onTick('${emp.emp_no}', this.checked)"></td>
      <td class="empno">${emp.emp_no}</td>
      <td>${emp.name}</td>
      <td>${selectHtml(emp.emp_no, "am", STATUS_OPTIONS, d.am)}</td>
      <td>${selectHtml(emp.emp_no, "pm", STATUS_OPTIONS, d.pm)}</td>
      <td>${selectHtml(emp.emp_no, "site", sites.map(s => s.code), d.site)}</td>
      <td>${selectHtml(emp.emp_no, "engineer", engineers.map(e => e.name), d.engineer)}</td>
      <td><input class="cell-input narrow" value="${d.ot}" onchange="onField('${emp.emp_no}','ot',this.value)"></td>
      <td><input class="cell-input narrow" value="${d.bh}" onchange="onField('${emp.emp_no}','bh',this.value)"></td>
      <td><input class="cell-input comments" value="${escapeAttr(d.comments)}" onchange="onField('${emp.emp_no}','comments',this.value)"></td>
    `;
    tbody.appendChild(tr);
  });
}

function selectHtml(empNo, field, values, current) {
  const opts = ['<option value="">-</option>'].concat(
    values.map(v => `<option value="${v}" ${v === current ? "selected" : ""}>${v}</option>`)
  );
  return `<select onchange="onField('${empNo}','${field}',this.value)">${opts.join("")}</select>`;
}

function escapeAttr(s) { return (s || "").replace(/"/g, "&quot;"); }

function onField(empNo, field, value) { rowData[empNo][field] = value; }
function onTick(empNo, checked) { checked ? ticked.add(empNo) : ticked.delete(empNo); }
function toggleAll(checked) {
  employees.forEach(e => checked ? ticked.add(e.emp_no) : ticked.delete(e.emp_no));
  renderRows();
}
function selectAll() { employees.forEach(e => ticked.add(e.emp_no)); renderRows(); }
function selectNone() { ticked.clear(); renderRows(); }

function applyBulk() {
  const am = document.getElementById("bulk-am").value;
  const pm = document.getElementById("bulk-pm").value;
  const site = document.getElementById("bulk-site").value;
  const engineer = document.getElementById("bulk-engineer").value;
  const ot = document.getElementById("bulk-ot").value;
  const bh = document.getElementById("bulk-bh").value;
  if (ticked.size === 0) {
    showStatus("warn", "Tick the checkbox next to the workers you want to apply this to.");
    return;
  }
  ticked.forEach(empNo => {
    const d = rowData[empNo];
    if (am) d.am = am;
    if (pm) d.pm = pm;
    if (site) d.site = site;
    if (engineer) d.engineer = engineer;
    if (ot) d.ot = ot;
    if (bh) d.bh = bh;
  });
  renderRows();
}

function showStatus(kind, text) {
  const el = document.getElementById("status-msg");
  if (!kind) { el.className = ""; el.textContent = ""; return; }
  el.className = kind;
  el.textContent = text;
}

async function saveAttendance() {
  const rows = [];
  employees.forEach(emp => {
    const d = rowData[emp.emp_no];
    if (!d.am && !d.pm) return; // nothing entered - let backend decide if a delete is needed
    rows.push({
      emp_no: emp.emp_no, full_date: currentDate,
      am: d.am, pm: d.pm, site: d.site, engineer: d.engineer,
      ot: d.ot ? parseFloat(d.ot) : 0, bh: d.bh ? parseFloat(d.bh) : 0,
      comments: d.comments,
    });
  });
  // Include cleared rows too, so the backend can delete previously-saved entries
  employees.forEach(emp => {
    const d = rowData[emp.emp_no];
    if (!d.am && !d.pm) {
      rows.push({ emp_no: emp.emp_no, full_date: currentDate, am: "", pm: "", site: "", engineer: "", ot: 0, bh: 0, comments: "" });
    }
  });

  try {
    const result = await apiCall("/attendance/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows }),
    });
    let msg = `Saved ${result.saved} worker(s) for ${currentDate}.`;
    if (result.blocked && result.blocked.length) {
      msg += "\n\nBlocked (Holiday needs previous day filled in first):\n" + result.blocked.join("\n");
      showStatus("warn", msg);
    } else {
      showStatus("ok", msg);
    }
    await loadDate(currentDate, true);
  } catch (e) {
    if (e.body && e.body.detail && e.body.detail.errors) {
      showStatus("err", "Fix these before saving:\n" + e.body.detail.errors.join("\n"));
    } else {
      showStatus("err", "Save failed: " + (e.body?.detail || "Unknown error"));
    }
  }
}

// Auto-resume session if a token is already stored
(function tryResume() {
  const saved = sessionStorage.getItem("infinia_token");
  if (saved) {
    TOKEN = saved;
    apiCall("/auth/me").then(me => {
      document.getElementById("who-label").textContent = `${me.full_name} (${me.role})`;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      initApp();
    }).catch(() => sessionStorage.removeItem("infinia_token"));
  }
})();
</script>
</body>
</html>
