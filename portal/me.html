  // light / dark / as the phone (24/11/2026) - set before the page draws, so it never flashes white
  (function () {
    var t = "auto"; try { t = localStorage.getItem("me_theme") || "auto"; } catch (e) {}
    var dark = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();

  (function () {
    var k = new URLSearchParams(location.search).get("k") || "";

  })();

  .ring .ic { background: var(--accent); color: var(--onAccent); }
  .top .gear { background: var(--glass); color: var(--ink); }
  .bar { background: var(--barbg); }
  .cap input::placeholder { color: var(--mute); opacity: 1; }
  .mon .grid button.sel.td, .mon .grid button.sel { color: var(--onAccent); box-shadow: none; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .sheet { background: var(--card); } }
  @media (min-width: 900px) {
    .two { display: grid; grid-template-columns: 1fr 380px; gap: 10px; align-items: start; }
    .two .side { position: sticky; top: 10px; }
  }
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none"></div>
<div id="app" style="display:none">
  <header class="top">
    <div class="toprow"><div><h1 id="h1">What's next</h1><div class="sub" id="sub"></div></div>
      <button class="gear" onclick="openSettings()" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    <div class="chips" id="chips"></div>
  </header>
  <main class="pager" id="pager">
    <section class="pg" id="pg-next"></section>
    <section class="pg" id="pg-cal"></section>
    <section class="pg" id="pg-notes"></section>
    <section class="pg" id="pg-done"></section>
  </main>
  <div class="bar"><div class="in">
    <div class="cap">
      <input id="q" placeholder="Remind me…" enterkeyhint="done" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();quickAdd();}">
      <button class="mic" id="mic" onclick="speak()" aria-label="Speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="go" id="gobtn" onclick="quickAdd()" aria-label="Add" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
    <div class="hint" id="hint"></div>
    <nav class="nav" id="nav"><span class="ind" id="ind"></span>
      <button data-v="next" onclick="show('next')"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>Next</button>
      <button data-v="cal" onclick="show('cal')"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
      <button data-v="notes" onclick="show('notes')"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20a.5.5 0 0 1-.5.5h-12A.5.5 0 0 1 6 20z"/><path d="M14.5 3.5V8H19M9 12.5h7M9 16h5"/></svg>Notes</button>
      <button data-v="done" onclick="show('done')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.5 2.5 5-5.2"/></svg>Done</button>
    </nav>
  </div></div>
</div>
<div class="shade" id="shade" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="ring" id="ring"></div>

<script>
const K = new URLSearchParams(location.search).get("k") || "";
const DEVKEY = "me_dev_" + K;
let DEV = ""; try { DEV = localStorage.getItem(DEVKEY) || ""; } catch (e) {}
let ITEMS = [], NOW = new Date(), VIEW = "next", FILTER = "all", CALM = null, CALSEL = null, RUNG = {};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dmy = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";
const DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function dubaiNow() { const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 240) * 60000); }

async function api(path, opt = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(path + sep + "k=" + encodeURIComponent(K), { ...opt, headers: { "Content-Type": "application/json", "X-Personal-Device": DEV, ...(opt.headers || {}) } });
  if (r.status === 401 && !opt.noGate) { gate(); throw new Error("Sign in on this device."); }
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((d && d.detail) || "Something went wrong.");
  return d;
}

// ---------------- sign in once ----------------
let BEARER = "";
async function start() {
  if (!K) { document.body.innerHTML = '<div class="gate"><h1>Not found</h1></div>'; return; }
  try {
    const st = await api("/users/personal/state", { noGate: true });
    if (st.ready) { ready(); return; }
    gate(st.has_pin);
  } catch (e) { document.body.innerHTML = '<div class="gate"><h1>Not found</h1><p>Check the address, or open it again from the app (Settings › General).</p></div>'; }
}
function gate(hasPin) {
  $("app").style.display = "none"; $("gate").style.display = "";
  $("gate").innerHTML = `<h1>Sign in once</h1><p>Your own login for the app. This phone then stays signed in.</p>
    <input id="g-u" placeholder="Username" autocapitalize="none" autocomplete="username">
    <input id="g-p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn(${hasPin ? 1 : 0})">
    <div class="err" id="g-err"></div><button class="btn pri" style="width:100%" onclick="signIn(${hasPin ? 1 : 0})">Next</button>`;
}
async function signIn(hasPin) {
  $("g-err").textContent = "";
  const f = new URLSearchParams({ username: $("g-u").value.trim(), password: $("g-p").value });
  const r = await fetch("/auth/login", { method: "POST", body: f });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.access_token) { $("g-err").textContent = (d && d.detail) || "Wrong username or password."; return; }
  BEARER = d.access_token;
  try { hasPin = (await api("/users/personal/state", { noGate: true })).has_pin; } catch (e) {}
  $("gate").innerHTML = hasPin
    ? `<h1>Your PIN</h1><p>The PIN you set for this page.</p><input id="g-pin" class="pin" inputmode="numeric" type="password" maxlength="6" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
       <div class="err" id="g-err"></div><button class="btn pri" style="width:100%" onclick="unlock()">Open</button>`
    : `<h1>Set a PIN</h1><p>4 to 6 digits. Asked once on each new phone or computer - then it stays signed in.</p>
       <input id="g-pin" class="pin" inputmode="numeric" type="password" maxlength="6" autocomplete="off" placeholder="PIN">
       <input id="g-pin2" class="pin" inputmode="numeric" type="password" maxlength="6" autocomplete="off" placeholder="Again" onkeydown="if(event.key==='Enter')unlock(1)">
       <div class="err" id="g-err"></div><button class="btn pri" style="width:100%" onclick="unlock(1)">Save PIN</button>`;
  setTimeout(() => $("g-pin").focus(), 50);
}
async function unlock(isNew) {
  const pin = $("g-pin").value.trim();
  if (isNew && pin !== $("g-pin2").value.trim()) { $("g-err").textContent = "The two PINs are not the same."; return; }
  const label = (navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows/) || ["device"])[0];
  const r = await fetch("/users/personal/unlock?k=" + encodeURIComponent(K), { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + BEARER }, body: JSON.stringify({ pin, label }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("g-err").textContent = d.detail || "That did not work."; return; }
  DEV = d.device; try { localStorage.setItem(DEVKEY, DEV); } catch (e) {}
  BEARER = ""; $("gate").style.display = "none"; ready();
}

// ---------------- the list ----------------
async function ready() {
  $("app").style.display = ""; $("gate").style.display = "none";
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("/portal/me-sw.js", { scope: "/portal/me" }).catch(() => {}); } catch (e) {}
  pagerSetup();
  await load();
  const open = new URLSearchParams(location.search).get("open");
  if (open) { const it = ITEMS.find(x => String(x.id) === open); if (it) edit(it.id); history.replaceState(null, "", "?k=" + encodeURIComponent(K)); }
  setInterval(load, 60000);
  setInterval(checkRing, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
async function load() {
  try { const d = await api("/users/personal/items"); ITEMS = d.items; render(); checkRing(); } catch (e) {}
}
const when = i => i.due_on ? new Date(i.due_on + "T" + (i.due_time || "23:59") + ":00") : null;
function bucket(i) {
  const n = dubaiNow(), today = iso(n);
  if (!i.due_on) return "nodate";
  const d = i.due_on;
  if (d < today || (d === today && i.due_time && when(i) < n)) return "overdue";
  if (d === today) return "today";
  const t = new Date(n); t.setDate(t.getDate() + 1);
  if (d === iso(t)) return "tomorrow";
  const w = new Date(n); w.setDate(w.getDate() + 7);
  if (d <= iso(w)) return "week";
  return "later";
}
function rowHtml(i, b) {
  const dt = i.due_on ? (b === "week" ? DAY[new Date(i.due_on + "T12:00").getDay()] + " " : (b === "later" || b === "overdue" ? dmy(i.due_on).slice(0, 5) + " " : "")) : "";
  const tm = (dt + (i.due_time || "")).trim();
  const late = b === "overdue" ? Math.max(0, Math.round((dubaiNow() - new Date(i.due_on + "T" + (i.due_time || "23:59"))) / 86400000)) : 0;
  return `<div class="it${b === "overdue" ? " od" : ""}" data-id="${i.id}">
    <button class="tick${i.done_at ? " done" : ""}" onclick="event.stopPropagation(); ${i.done_at ? "undo" : "tick"}(${i.id}, this)" aria-label="Done">${i.done_at ? "✓" : ""}</button>
    <div class="tx" onclick="edit(${i.id})"><div class="t1">${esc(i.title)}</div>
      <div class="t2"><span class="tg ${i.tag}">${i.tag === "work" ? "Work" : "Personal"}</span>${i.repeat ? "↻ " + i.repeat + " " : ""}${b === "overdue" ? (late ? `${late} day${late > 1 ? "s" : ""} late` : "late") : ""}${i.body ? " · " + esc(i.body.slice(0, 40)) : ""}</div></div>
    <div class="rt" onclick="edit(${i.id})">${esc(tm)}${i.remind_at && !i.reminded ? '<svg class="bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>' : ""}${!i.done_at && (b === "overdue" || b === "today") ? `<span class="later" onclick="event.stopPropagation(); later(${i.id})">Later ›</span>` : ""}</div></div>`;
}
function counts() {
  const open = ITEMS.filter(i => i.kind !== "note" && !i.done_at);
  const o = open.filter(i => bucket(i) === "overdue").length, t = open.filter(i => bucket(i) === "today").length;
  const n = dubaiNow();
  $("sub").textContent = `${DAY[n.getDay()]} ${pad(n.getDate())}/${pad(n.getMonth() + 1)}` + (o ? ` · ${o} overdue` : "") + ` · ${t} today`;
}
const VIEWS = ["next", "cal", "notes", "done"], TITLES = { next: "What's next", cal: "Calendar", notes: "Notes", done: "Done" };
const keep = i => FILTER === "all" || i.tag === FILTER;
function render() {
  counts();
  $("chips").innerHTML = [["all", "All"], ["personal", "Personal"], ["work", "Work"]].map(([k, l]) => `<button class="${FILTER === k ? "on" : ""}" onclick="FILTER='${k}';render()">${l}</button>`).join("");
  renderNext(); renderCal(); renderNotes(); renderDone();
}
function renderNext() {
  const open = ITEMS.filter(i => i.kind !== "note" && !i.done_at && keep(i)).sort((a, b) => (a.due_on || "9999") + (a.due_time || "99") < (b.due_on || "9999") + (b.due_time || "99") ? -1 : 1);
  const secs = [["overdue", "● Overdue", "red"], ["today", "Today"], ["tomorrow", "Tomorrow"], ["week", "This week"], ["later", "Later"], ["nodate", "Any time"]];
  let h = "";
  for (const [k, l, c] of secs) { const rs = open.filter(i => bucket(i) === k); if (rs.length) h += `<div class="sec ${c || ""}">${l}</div>` + rs.map(i => rowHtml(i, k)).join(""); }
  $("pg-next").innerHTML = h || `<div class="empty">Nothing waiting.<br>Type or speak below.</div>`;
}
// ----- calendar: 6 months back, 18 ahead; swipe the months, the strip follows and lights up the one in view -----
let CALIDX = null, CALN = 0, MLIST = [];
function renderCal() {
  const n = dubaiNow();
  MLIST = []; for (let k = -6; k <= 18; k++) MLIST.push(new Date(n.getFullYear(), n.getMonth() + k, 1));
  if (CALIDX == null) CALIDX = 6;
  CALSEL = CALSEL || iso(n);
  const byDay = {}; ITEMS.filter(i => i.due_on && i.kind !== "note" && keep(i)).forEach(i => (byDay[i.due_on] = byDay[i.due_on] || []).push(i));
  const pg = $("pg-cal"), keepTop = pg.scrollTop;
  pg.innerHTML = `<div class="mstrip" id="mstrip">${MLIST.map((m, k) => `<button data-k="${k}" class="${k === CALIDX ? "on" : ""}" onclick="goMonth(${k}, true)">${MON[m.getMonth()].slice(0, 3)}${m.getMonth() === 0 || k === 0 ? `<small>${m.getFullYear()}</small>` : ""}</button>`).join("")}</div>
    <div class="months" id="months">${MLIST.map((m, k) => monthHtml(m, byDay, n)).join("")}</div>
    <div class="dayhead"><b id="dayt"></b><button onclick="goToday()">Today</button></div><div id="daylist"></div>`;
  const ms = $("months");
  requestAnimationFrame(() => { ms.scrollLeft = CALIDX * ms.clientWidth; centerChip(false); pg.scrollTop = keepTop; });
  let t = null;
  ms.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(() => { const k = Math.round(ms.scrollLeft / ms.clientWidth); if (k !== CALIDX) monthChanged(k); }, 70); }, { passive: true });
  renderDay(byDay);
}
function monthHtml(m, byDay, n) {
  const start = new Date(m); start.setDate(1 - ((m.getDay() + 6) % 7));
  let g = ["M", "T", "W", "T", "F", "S", "S"].map(x => `<div class="dn">${x}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    if (k >= 35 && d.getMonth() !== m.getMonth()) break;
    const s = iso(d), its = byDay[s] || [], oth = d.getMonth() !== m.getMonth();
    g += oth ? `<span></span>` : `<button data-d="${s}" class="${s === iso(n) ? "td" : ""}${s === CALSEL ? " sel" : ""}" onclick="pickDay('${s}')">${d.getDate()}${its.length ? `<span class="dots">${its.slice(0, 3).map(i => `<i class="${i.tag === "personal" ? "p" : ""}"></i>`).join("")}</span>` : ""}</button>`;
  }
  return `<div class="mon"><div class="card"><h2>${MON[m.getMonth()]} <span>${m.getFullYear()}</span></h2><div class="grid">${g}</div></div></div>`;
}
function centerChip(smooth) {
  const st = $("mstrip"); if (!st) return;
  st.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.k === CALIDX));
  const b = st.querySelector(`button[data-k="${CALIDX}"]`);
  if (b) { const x = st.scrollLeft + (b.getBoundingClientRect().left - st.getBoundingClientRect().left) - st.clientWidth / 2 + b.offsetWidth / 2;
    st.scrollTo({ left: x, behavior: smooth ? "smooth" : "auto" }); }
}
function monthChanged(k) {
  CALIDX = k; centerChip(true);
  const m = MLIST[k], n = dubaiNow();
  if (CALSEL.slice(0, 7) !== iso(m).slice(0, 7)) pickDay(m.getMonth() === n.getMonth() && m.getFullYear() === n.getFullYear() ? iso(n) : iso(m));
}
function goMonth(k, smooth) { const ms = $("months"); ms.scrollTo({ left: k * ms.clientWidth, behavior: smooth ? "smooth" : "auto" }); if (!smooth) monthChanged(k); }
function goToday() { const n = dubaiNow(); CALSEL = iso(n); goMonth(6, true); pickDay(CALSEL); }
function pickDay(s) {
  CALSEL = s;
  document.querySelectorAll("#months .grid button").forEach(b => b.classList.toggle("sel", b.dataset.d === s));
  const byDay = {}; ITEMS.filter(i => i.due_on && i.kind !== "note" && keep(i)).forEach(i => (byDay[i.due_on] = byDay[i.due_on] || []).push(i));
  renderDay(byDay);
}
function renderDay(byDay) {
  const day = (byDay[CALSEL] || []).sort((a, b) => (a.due_time || "99") < (b.due_time || "99") ? -1 : 1);
  const d = new Date(CALSEL + "T12:00");
  $("dayt").textContent = `${["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d.getDay()]} ${dmy(CALSEL)}`;
  $("daylist").innerHTML = day.map(i => rowHtml(i, i.done_at ? "" : bucket(i) === "overdue" ? "overdue" : "")).join("") +
    `<div style="padding:4px 16px"><button class="btn" style="width:100%" onclick="edit(null,'${CALSEL}')">+ Add on this day</button></div>`;
}
function renderNotes() {
  const ns = ITEMS.filter(i => i.kind === "note" && keep(i)).sort((a, b) => (b.pinned - a.pinned) || (a.updated_at < b.updated_at ? 1 : -1));
  $("pg-notes").innerHTML = `<div class="notes"><button class="note addnote" onclick="edit(null,null,'note')">+ New note</button>${ns.map(n => `<button class="note ${n.tag}" onclick="edit(${n.id})">${n.pinned ? '<span class="pin">📌</span>' : ""}<b>${esc(n.title || "Note")}</b><span>${esc(n.body)}</span></button>`).join("")}</div>`;
}
function renderDone() {
  const ds = ITEMS.filter(i => i.done_at && keep(i)).sort((a, b) => a.done_at < b.done_at ? 1 : -1);
  $("pg-done").innerHTML = ds.length ? `<div class="sec">Last 30 days</div>` + ds.map(i => rowHtml(i, "")).join("") : `<div class="empty">Ticked-off things show here for 30 days.</div>`;
}
// ----- swiping between the four pages; the tab bar's highlight slides with your finger -----
function pagerSetup() {
  const pg = $("pager"); let raf = null;
  pg.addEventListener("scroll", () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const f = pg.scrollLeft / pg.clientWidth, k = Math.round(f);
      $("ind").style.transform = `translateX(${f * 100}%)`;
      if (VIEWS[k] && VIEWS[k] !== VIEW) { VIEW = VIEWS[k]; navOn(); }
    });
  }, { passive: true });
  window.addEventListener("resize", () => { pg.scrollLeft = VIEWS.indexOf(VIEW) * pg.clientWidth; });
  navOn();
}
function navOn() {
  document.querySelectorAll(".nav button").forEach(b => b.style.color = b.dataset.v === VIEW ? "var(--redtx)" : "var(--mute)");
  $("h1").textContent = TITLES[VIEW];
}
function show(v) { const pg = $("pager"); pg.scrollTo({ left: VIEWS.indexOf(v) * pg.clientWidth, behavior: "smooth" }); }

// ---------------- add, tick, later ----------------
$("q").addEventListener("input", () => { const has = !!$("q").value.trim(); $("gobtn").style.display = has ? "" : "none"; $("mic").style.display = has ? "none" : ""; });
async function quickAdd() {
  const t = $("q").value.trim(); if (!t) return;
  try {
    const i = await api("/users/personal/quick", { method: "POST", body: JSON.stringify({ text: t }) });
    $("q").value = ""; $("q").dispatchEvent(new Event("input")); $("hint").textContent = "";
    ITEMS.push(i);
    render();
    if (i.kind === "note" && VIEW !== "notes") show("notes"); else if (i.kind !== "note" && VIEW === "notes") show("next");
    const w = i.kind === "note" ? "Note saved" : (i.due_on ? `${DAY[new Date(i.due_on + "T12:00").getDay()]} ${dmy(i.due_on).slice(0, 5)}${i.due_time ? " " + i.due_time : ""}${i.remind_at ? " 🔔" : ""}` : "Added");
    toast(`${esc(i.title)} - ${w}`, "Change", () => edit(i.id));
  } catch (e) { toast(esc(e.message)); }
}
async function tick(id, el) {
  if (el.dataset.busy) return; el.dataset.busy = 1;
  el.classList.add("done"); el.textContent = "✓";
  try {
    const r = await api(`/users/personal/items/${id}/done`, { method: "POST" });
    const row = el.closest(".it"); if (row) setTimeout(() => row.classList.add("gone"), 250);
    setTimeout(load, 550);
    toast(r.done_at ? "Done" : `Next: ${dmy(r.due_on)}`, r.done_at ? "Undo" : "", r.done_at ? () => undo(id) : null);
  } catch (e) { toast(esc(e.message)); }
}
async function undo(id) { try { await api(`/users/personal/items/${id}/undone`, { method: "POST" }); load(); } catch (e) {} }
function later(id) {
  sheet(`<h3>Later</h3><div class="menu">${[["1h", "In 1 hour"], ["evening", "This evening (19:00)"], ["tomorrow", "Tomorrow morning (09:00)"], ["week", "Next week (Monday 09:00)"]].map(([k, l]) => `<button onclick="snooze(${id},'${k}')">${l}</button>`).join("")}</div>`);
}
async function snooze(id, how) { closeSheet(); try { const r = await api(`/users/personal/items/${id}/snooze`, { method: "POST", body: JSON.stringify({ how }) }); toast(`Moved to ${dmy(r.due_on).slice(0, 5)} ${r.due_time} 🔔`); load(); } catch (e) { toast(esc(e.message)); } }

// ---------------- edit ----------------
const REMS = [["", "No reminder"], ["0", "At the time"], ["10", "10 min before"], ["30", "30 min before"], ["60", "1 hour before"], ["1440", "1 day before"]];
function remBefore(i) {
  if (!i) return "0";                                   // a new one rings at its time
  const m = i.remind_before === "" || i.remind_before == null ? "" : String(i.remind_before);
  return REMS.some(x => x[0] === m) ? m : (m ? "0" : "");
}
function edit(id, day, kind) {
  const i = id ? ITEMS.find(x => x.id === id) : { kind: kind || "task", title: "", body: "", tag: FILTER === "work" ? "work" : "personal", due_on: day || "", due_time: "", repeat: "", pinned: false };
  if (!i) return;
  const note = i.kind === "note";
  sheet(`<h3>${id ? (note ? "Note" : "Edit") : (note ? "New note" : "New")}</h3>
    <div class="f"><input id="e-title" placeholder="${note ? "Title" : "What is it?"}" value="${esc(i.title)}"></div>
    <div class="f"><div class="seg" id="e-tag">${["personal", "work"].map(t => `<button class="${i.tag === t ? "on" : ""}" data-t="${t}" onclick="segOn(this)">${t === "work" ? "Work" : "Personal"}</button>`).join("")}</div></div>
    ${note ? `<div class="f"><textarea id="e-body" style="min-height:42vh" placeholder="Write…">${esc(i.body)}</textarea></div>
      <div class="f"><label><input type="checkbox" id="e-pin" ${i.pinned ? "checked" : ""} style="width:auto;margin-right:8px">Pin to the top</label></div>`
    : `<div class="row2"><div class="f"><label>Date</label><input id="e-date" type="date" value="${i.due_on}"></div><div class="f"><label>Time</label><input id="e-time" type="time" value="${i.due_time}"></div></div>
      <div class="row2"><div class="f"><label>Remind me</label><select id="e-rem">${REMS.map(([v, l]) => `<option value="${v}" ${remBefore(id ? i : null) === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="f"><label>Repeat</label><select id="e-rep">${[["", "Never"], ["daily", "Every day"], ["weekly", "Every week"], ["monthly", "Every month"], ["yearly", "Every year"]].map(([v, l]) => `<option value="${v}" ${i.repeat === v ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>
      <div class="f"><label>Notes</label><textarea id="e-body" placeholder="Anything to remember about it">${esc(i.body)}</textarea></div>`}
    <div class="acts">${id ? `<button class="btn del" onclick="del(${id})">Delete</button>` : ""}<button class="btn" onclick="closeSheet()">Cancel</button><button class="btn pri" onclick="saveEdit(${id || 0}, '${i.kind}')">Save</button></div>`);
  if (!id) setTimeout(() => $("e-title").focus(), 250);
}
function segOn(b) { b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
async function saveEdit(id, kind) {
  const p = { kind, title: $("e-title").value.trim(), body: $("e-body").value, tag: document.querySelector("#e-tag .on").dataset.t };
  if (kind === "note") p.pinned = $("e-pin").checked;
  else { p.due_on = $("e-date").value; p.due_time = $("e-time").value; p.repeat = $("e-rep").value; p.remind_before = p.due_on ? $("e-rem").value : ""; }
  if (kind !== "note" && !p.title) { $("e-title").focus(); return; }
  try {
    await api(id ? `/users/personal/items/${id}` : "/users/personal/items", { method: id ? "PUT" : "POST", body: JSON.stringify(p) });
    closeSheet(); load();
  } catch (e) { toast(esc(e.message)); }
}
async function del(id) {
  closeSheet();
  try { await api(`/users/personal/items/${id}`, { method: "DELETE" }); ITEMS = ITEMS.filter(x => x.id !== id); render(); toast("Deleted"); } catch (e) { toast(esc(e.message)); }
}

// ---------------- sheet, toast ----------------
function sheet(h) { $("sheet").innerHTML = `<div class="grab"></div>` + h; $("sheet").classList.add("open"); $("shade").classList.add("open"); }
function closeSheet() { $("sheet").classList.remove("open"); $("shade").classList.remove("open"); }
let TT = null;
function toast(msg, act, fn) {
  const t = $("toast"); t.innerHTML = `<span>${msg}</span>${act ? `<button id="t-act">${act}</button>` : ""}`; t.style.display = "flex";
  if (act) $("t-act").onclick = () => { t.style.display = "none"; fn && fn(); };
  clearTimeout(TT); TT = setTimeout(() => t.style.display = "none", act ? 6000 : 2600);
}

// ---------------- voice ----------------
// Safari's own speech recognition does not work in a Home Screen app on the iPhone (24/11/2026). So the phone
// records, stops by itself 1.4 s after you stop talking (or a second tap, or 20 s), and the server writes it out.
// What was heard goes in the box to check, then ↑ adds it. Server not set up / no mic → the keyboard's own 🎤.
let REC = null, RECMAX = null, VOICE = null, LVL = null;
function keyboardMic(msg) { $("q").focus(); $("hint").textContent = msg || "Tap the 🎤 on your keyboard and speak."; }
async function voiceReady() {
  if (VOICE === null) { try { VOICE = !!(await api("/users/personal/voice")).ready; } catch (e) { VOICE = false; } }
  return VOICE;
}
function stopRec() { clearTimeout(RECMAX); if (REC && REC.state !== "inactive") { try { REC.stop(); } catch (e) {} } }
async function speak() {
  if (REC) { stopRec(); return; }
  if ($("mic").classList.contains("busy")) return;
  if (!navigator.mediaDevices || !window.MediaRecorder || !(await voiceReady())) return keyboardMic();
  let st;
  try { st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { return keyboardMic("Allow the microphone for this app (iPhone Settings), or tap the 🎤 on your keyboard."); }
  const mt = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const r = new MediaRecorder(st, mt ? { mimeType: mt } : {}), parts = []; REC = r;
  let spoke = false, loud = 0, floor = 0, n = 0; const t0 = Date.now();
  // listen to the level: tells when you have finished, and makes the mic glow as you talk
  try {
    const C = ac(), an = C.createAnalyser(); an.fftSize = 1024; C.createMediaStreamSource(st).connect(an);
    const buf = new Uint8Array(an.fftSize);
    LVL = setInterval(() => {
      an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) sum += (v - 128) * (v - 128);
      const rms = Math.sqrt(sum / buf.length) / 128, now = Date.now();
      if (n++ < 4) { floor = Math.max(floor, rms); return; }                    // the room's own noise, first 0.4 s
      if (rms > Math.max(.025, floor * 2.5)) { spoke = true; loud = now; }
      $("mic").style.setProperty("--lvl", Math.min(1, rms * 8).toFixed(2));
      if ((spoke && now - loud > 1400) || (!spoke && now - t0 > 7000)) stopRec();
    }, 100);
  } catch (e) { spoke = true; }
  r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
  r.onstop = async () => {
    clearInterval(LVL); st.getTracks().forEach(t => t.stop()); REC = null;
    const m = $("mic"); m.classList.remove("rec"); m.style.removeProperty("--lvl");
    const blob = new Blob(parts, { type: r.mimeType || mt || "audio/mp4" });
    if (!spoke || blob.size < 1000) { $("hint").textContent = "Didn't hear anything - tap the mic and speak."; return; }
    m.classList.add("busy"); $("hint").textContent = "Writing it out…";
    try {
      const res = await fetch("/users/personal/voice?k=" + encodeURIComponent(K), { method: "POST", body: blob, headers: { "Content-Type": blob.type, "X-Personal-Device": DEV } });
      const d = await res.json().catch(() => ({}));
      if (res.status === 503) { VOICE = false; return keyboardMic(); }
      if (!res.ok) throw new Error(d.detail || "Could not write that out.");
      if (!d.text) { $("hint").textContent = "Didn't catch that - tap the mic and try again."; return; }
      const q = $("q"); q.value = (q.value.trim() ? q.value.trim() + " " : "") + d.text.replace(/\.$/, "");
      q.dispatchEvent(new Event("input")); $("hint").textContent = "Check it, then press ↑ to add";
    } catch (e) { $("hint").textContent = e.message + " Or tap the 🎤 on your keyboard."; }
    finally { m.classList.remove("busy"); }
  };
  r.start(250); $("mic").classList.add("rec"); $("hint").textContent = "Listening…";
  RECMAX = setTimeout(stopRec, 20000);
}

// ---------------- reminder sounds (played by this page; the phone's own sound when the app is closed) -----------
let AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
  return AC;
}
// the iPhone only lets a page make sound after a touch - wake the sound up on the first one
["touchend", "pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { try { ac(); } catch (e) {} }, { passive: true }));
const SOUNDS = {        // [pitch Hz, start s, length s, wave, loudness]
  chime:   { name: "Chime",   notes: [[880, 0, .5, "sine", .35], [660, .28, .6, "sine", .35]] },
  crystal: { name: "Crystal", notes: [[1568, 0, 1, "sine", .22], [2093, .12, 1, "sine", .16], [3136, .24, 1.3, "sine", .08]] },
  marimba: { name: "Marimba", notes: [[523, 0, .3, "triangle", .45], [659, .13, .3, "triangle", .45], [784, .26, .5, "triangle", .45]] },
  harp:    { name: "Harp",    notes: [[392, 0, .8, "sine", .3], [494, .09, .8, "sine", .3], [587, .18, .8, "sine", .3], [784, .27, .9, "sine", .3], [988, .36, 1.2, "sine", .25]] },
  pulse:   { name: "Pulse",   notes: [[1046, 0, .13, "square", .07], [1046, .2, .13, "square", .07], [1046, .7, .13, "square", .07], [1046, .9, .13, "square", .07]] },
};
function soundKey() { let k = "chime"; try { k = localStorage.getItem("me_sound") || "chime"; } catch (e) {} return SOUNDS[k] ? k : "chime"; }
function play(key) {
  try {
    const C = ac(), t0 = C.currentTime + .03;
    for (const [f, t, d, w, v] of SOUNDS[key || soundKey()].notes) {
      const o = C.createOscillator(), g = C.createGain(); o.type = w; o.frequency.value = f; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(.0001, t0 + t); g.gain.exponentialRampToValueAtTime(v, t0 + t + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + t + d);
      o.start(t0 + t); o.stop(t0 + t + d + .05);
    }
  } catch (e) {}
}
function chime() { play(); }
function setSound(k) {
  try { localStorage.setItem("me_sound", k); } catch (e) {}
  document.querySelectorAll("#soundList button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  play(k);
}
function checkRing() {
  const n = dubaiNow();
  for (const i of ITEMS) {
    if (!i.remind_at || i.done_at || RUNG[i.id + i.remind_at]) continue;
    const r = new Date(i.remind_at + ":00");
    if (r <= n && n - r < 10 * 60000 && !document.hidden) {
      RUNG[i.id + i.remind_at] = 1; chime();
      const g = $("ring"); g.innerHTML = `<div class="ic">🔔</div><div style="flex:1"><b>${esc(i.title)}</b><div style="font-size:13px;color:var(--mute)">${i.due_time || "Now"}</div></div><button class="btn" style="flex:0 0 auto;padding:9px 12px" onclick="$('ring').style.display='none'">OK</button>`;
      g.style.display = "flex"; setTimeout(() => g.style.display = "none", 15000);
    }
  }
}

// ---------------- settings: notifications, this device ----------------
function theme() { try { return localStorage.getItem("me_theme") || "auto"; } catch (e) { return "auto"; } }
function applyTheme() {
  const t = theme(), dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("theme-color").setAttribute("content", dark ? "#5A1218" : "#E5483B");
}
function setTheme(t) { try { localStorage.setItem("me_theme", t); } catch (e) {} applyTheme(); document.querySelectorAll("#themeSeg button").forEach((b, k) => b.classList.toggle("on", ["auto", "light", "dark"][k] === t)); }
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}
applyTheme();
// iPhone keyboard: the type box rides on top of it, and a sheet never hides behind it
function fitKeyboard() {
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.querySelector(".bar").style.transform = kb > 60 ? `translateY(${-kb}px)` : "";
  document.querySelector(".bar").style.paddingBottom = kb > 60 ? "8px" : "";
  $("sheet").style.maxHeight = (vv.height - 20) + "px";
  $("sheet").style.bottom = kb > 60 ? kb + "px" : "0";
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fitKeyboard); visualViewport.addEventListener("scroll", fitKeyboard); }
function standalone() { return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone; }
async function openSettings() {
  const ios = /iPhone|iPad/.test(navigator.userAgent);
  const perm = ("Notification" in window) ? Notification.permission : "unsupported";
  sheet(`<h3>Reminders on this phone</h3>
    ${ios && !standalone() ? `<p style="line-height:1.5">First put this page on your Home Screen: tap <b>Share</b> (the square with the arrow ↑ at the bottom of Safari) → <b>Add to Home Screen</b> → <b>Add</b>. Then open it from the new icon and come back here.</p>` :
      `<p style="line-height:1.5;color:var(--noteInk)">Reminders pop up with sound at their time, even when this page is closed. ${perm === "granted" ? "✅ Allowed on this device." : ""}</p>
       <div class="acts" style="margin-top:4px"><button class="btn pri" onclick="pushOn()">Turn on reminders</button><button class="btn" onclick="pushTest()">Send a test</button></div>`}
    <h3 style="margin-top:18px">Reminder sound</h3>
    <div class="snd" id="soundList">${Object.entries(SOUNDS).map(([k, x]) => `<button data-k="${k}" class="${soundKey() === k ? "on" : ""}" onclick="setSound('${k}')"><span>${x.name}</span><i>▶</i></button>`).join("")}</div>
    <p style="font-size:13px;color:var(--mute);line-height:1.5;margin-top:8px">Tap one to hear it. It plays when a reminder comes up while this app is open. When the app is closed, the iPhone plays its own notification sound - Apple does not let web apps choose it. Silent mode or a Focus keeps both quiet.</p>
    <h3 style="margin-top:18px">Look</h3>
    <div class="seg" id="themeSeg">${[["auto", "As the phone"], ["light", "Bright red"], ["dark", "Deep red"]].map(([k, l]) => `<button class="${theme() === k ? "on" : ""}" onclick="setTheme('${k}')">${l}</button>`).join("")}</div>
    <h3 style="margin-top:18px">Signed-in devices</h3><div id="devs" style="font-size:14px;color:var(--noteInk)">…</div>
    <div class="menu" style="margin-top:10px">
      <button onclick="changePin()">Change my PIN</button>
      <button onclick="signOutOthers()">Sign out all other devices (a lost phone)</button>
      <button onclick="signOut()" style="color:var(--redtx)">Sign out this device</button></div>`);
  try { const d = await api("/users/personal/devices"); $("devs").innerHTML = d.devices.map(x => `<div style="padding:6px 0">${esc(x.label)}${x.this ? " <b>(this one)</b>" : ""} <span style="color:var(--mute)">· since ${dmy(x.since)}</span></div>`).join(""); } catch (e) {}
}
async function signOutOthers() {
  if (!confirm("Sign out every other phone and computer? They need the login and PIN again, and their reminders stop.")) return;
  try { const r = await api("/users/personal/sign-out-others", { method: "POST" }); closeSheet(); toast(`${r.signed_out} other device${r.signed_out === 1 ? "" : "s"} signed out`); } catch (e) { toast(esc(e.message)); }
}
function changePin() {
  sheet(`<h3>Change my PIN</h3><div class="f"><input id="p-old" class="pin" inputmode="numeric" type="password" maxlength="6" placeholder="Current PIN"></div>
    <div class="f"><input id="p-new" inputmode="numeric" type="password" maxlength="6" placeholder="New PIN (4-6 digits)"></div>
    <div class="acts"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn pri" onclick="savePin()">Save</button></div>`);
}
async function savePin() {
  try { await api("/users/personal/pin", { method: "POST", body: JSON.stringify({ old: $("p-old").value, new: $("p-new").value }) }); closeSheet(); toast("PIN changed"); } catch (e) { toast(esc(e.message)); }
}
function b64(s) { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushOn() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("This browser cannot show reminders - open it from the Home Screen icon.");
    const p = await Notification.requestPermission(); if (p !== "granted") throw new Error("Allow notifications for it in the phone's Settings.");
    const reg = await navigator.serviceWorker.register("/portal/me-sw.js", { scope: "/portal/me" });
    await new Promise(r => { if (reg.active) return r(); const w = reg.installing || reg.waiting; if (!w) return r(); w.addEventListener("statechange", () => w.state === "activated" && r()); setTimeout(r, 4000); });
    const { key } = await api("/users/personal/push/key");
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    await api("/users/personal/push/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) });
    closeSheet(); toast("Reminders are on ✅", "Test", pushTest);
  } catch (e) { toast(esc(e.message)); }
}
async function pushTest() { try { const r = await api("/users/personal/push/test", { method: "POST" }); toast(r.sent ? "Sent - it arrives in a few seconds" : "Turn reminders on first"); } catch (e) { toast(esc(e.message)); } }
async function signOut() {
  try { await api("/users/personal/forget-device", { method: "POST" }); } catch (e) {}
  try { const reg = await navigator.serviceWorker.getRegistration("/portal/me"); const sub = reg && await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  try { localStorage.removeItem(DEVKEY); } catch (e) {} DEV = ""; closeSheet(); gate(true);
}
start();
</script>
